name: Publish data release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: tar -czf ai-creator-index-data-${{ github.ref_name }}.tar.gz generated skills/explore-ai-creators
      - run: zip -r xhs-001-xiaogai-${{ github.ref_name }}.zip xhs-output/001-xiaogai
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ai-creator-index-data-${{ github.ref_name }}.tar.gz
            xhs-001-xiaogai-${{ github.ref_name }}.zip
