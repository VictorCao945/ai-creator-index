name: Publish data release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore: enable Pages and publish v0.1.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="v0.1.0"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: tar -czf ai-creator-index-data-${{ steps.version.outputs.value }}.tar.gz generated skills/explore-ai-creators
      - run: zip -r xhs-001-xiaogai-${{ steps.version.outputs.value }}.zip xhs-output/001-xiaogai
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              "ai-creator-index-data-$VERSION.tar.gz" \
              "xhs-001-xiaogai-$VERSION.zip"
          fi
