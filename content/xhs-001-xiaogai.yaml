caption: |
  《我关注的100位小红书科技博主》#001，从小盖开始。

  这次实际遍历到 828 篇公开笔记，时间从 2025-01-14 到 2026-07-23；近 92 天共有 103 篇。热度数据是 2026-07-26 的一次性快照。

  小盖不是“工具说明书型”账号。他更像一名中文科技策展人：从 X、播客、直播和演讲中发现素材，再用一个强观点完成转述与提炼。

  真正值得继续追的，我整理成 5 条线索：

  1. OpenClaw 的机会可能在垂直数字员工，不只是安装教程。
  2. “先采访、后执行”提示词，本质是把需求澄清写进工作流。
  3. Codex 正从编程工具走向知识工作台，但“连接 Kimi”没有找到官方支持说明。
  4. Notion、Anthropic、Dyson 三期内容反复指向 agency、taste 与学习目的。
  5. Agent 进入开放环境后，密钥、权限、额度、撤销和审计要先设计。

  我把完整的代表笔记、原始链接、证据等级和未解决项放进了公开 GitHub「AI 创作者档案库」，也做了一个只读查询 Skill：explore-ai-creators。

  这不是“起底”，而是一份可被纠正的内容情报底稿。欢迎小盖本人和读者补充更准确的出处。

  下一位，你想让我翻谁？

